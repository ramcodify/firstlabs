<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security & Anti-Abuse Meta Directives -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Anti-Clickjacking Frame-Busting Protection -->
    <style id="antiClickjack">
      /* Hidden until top frame verification passes */
      body { display: none !important; }
    </style>
    <script>
      /* Ensure page is not being hosted in an unauthorized frame/iframe (Clickjacking mitigation) */
      if (self === top) {
        var antiClickjack = document.getElementById("antiClickjack");
        if (antiClickjack && antiClickjack.parentNode) {
          antiClickjack.parentNode.removeChild(antiClickjack);
        }
      } else {
        top.location = self.location;
      }
    </script>

    <!-- SEO & Social Meta Tags -->
    <meta name="description" content="The First Labs builds Android solutions that make work, learning, and life a little easier. Explore FirstHire, CopyShelf, and Gym Timer." />
